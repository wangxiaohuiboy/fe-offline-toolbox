services:
  translation:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models/m2m100-418m-ct2-int8:/models/m2m100-418m-ct2-int8:ro
    environment:
      TRANSLATE_MODEL_DIR: /models/m2m100-418m-ct2-int8
      TRANSLATE_DEVICE: ${TRANSLATE_DEVICE:-cpu}
      TRANSLATE_COMPUTE_TYPE: ${TRANSLATE_COMPUTE_TYPE:-int8}
      TRANSLATE_INTER_THREADS: ${TRANSLATE_INTER_THREADS:-1}
      TRANSLATE_INTRA_THREADS: ${TRANSLATE_INTRA_THREADS:-0}
      TRANSLATE_CACHE_SIZE: ${TRANSLATE_CACHE_SIZE:-2048}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_ALLOWED_ORIGINS: ${TRANSLATE_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
